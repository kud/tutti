# Versions verified against upstream git tags on 2026-10-20 where marked (tag).
# AGP and the AndroidX/Compose artifacts live on Google Maven, which cannot be
# reached from the build sandbox: those are known-good pairs, settled by CI and Dependabot.
[versions]
agp = "8.13.0"                 # AGP 8.x line; Gradle 8.14.3 wrapper
kotlin = "2.4.21"              # (tag) v2.3.20; KSP 2.3.12 is built against it
ksp = "2.3.12"                 # (tag) KSP2, Kotlin-version independent
hilt = "2.58"                  # (tag) last Dagger whose Hilt plugin runs on AGP 8: 2.59 uses ScopedArtifact.POST_COMPILATION_CLASSES (AGP 9 API), 2.59.1 makes AGP 9 the floor
wire = "7.1.0"                 # (tag) requires Gradle 8.2+
coroutines = "1.11.0"          # (tag)
serialization = "1.12.0"        # (tag)
okhttp = "5.3.2"               # (tag) parent-5.3.2
bouncycastle = "1.80"
composeBom = "2025.05.00"
coreKtx = "1.16.0"
coreSplashscreen = "1.2.0"     # Google Maven metadata, 2026-10-23
activityCompose = "1.10.1"
lifecycle = "2.9.0"
datastore = "1.1.7"
glance = "1.1.1"
browser = "1.8.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
wire = { id = "com.squareup.wire", version.ref = "wire" }
