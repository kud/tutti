name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create on this commit and release (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-dev.N); empty for a plain build"
        required: false
        default: ""

permissions:
  contents: read

# A manual release run gets its own group: it no longer queues behind the push
# build of the same merge (that wait doubled the time to an APK), and GitHub
# never swaps it for a newer pending run of the other kind.
concurrency:
  group: android-${{ github.event_name == 'workflow_dispatch' && 'release' || 'ci' }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Test, lint, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6.4.1

      # Both builds are tested, linted and assembled: `github` (with the updater, the one published
      # here) and `fdroid` (no updater, built by F-Droid from source). A final release also attaches
      # the release-signed fdroid APK for F-Droid's reproducible-build check (release job below).
      # A manual run without a tag also writes the render tests' PNGs (invented fixtures), to judge a
      # visual change, and the showcase screenshots (README, F-Droid) under `renders/showcase`; push,
      # PR and release runs never do.
      - name: Test, lint and assemble
        env:
          TUTTI_RENDERS: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && format('{0}/renders', github.workspace) || '' }}
          TUTTI_SHOWCASE: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && format('{0}/renders/showcase', github.workspace) || '' }}
        run: ./gradlew --stacktrace :protocol:test :app:testGithubDebugUnitTest :app:testFdroidDebugUnitTest :app:lintGithubDebug :app:lintFdroidDebug :app:assembleGithubDebug :app:assembleFdroidDebug

      - name: No lint errors
        run: |
          for f in app/build/reports/lint-results-githubDebug.xml app/build/reports/lint-results-fdroidDebug.xml; do
            test "$(grep -c 'severity="Error"' "$f")" = 0 || { echo "::error::lint errors in $f"; exit 1; }
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error

      - name: Upload renders
        if: always() && github.event_name == 'workflow_dispatch' && inputs.tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: renders
          path: renders/
          if-no-files-found: ignore

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            protocol/build/reports/
            app/build/reports/
          if-no-files-found: ignore

  # A manual run without a tag: is the fdroid release build deterministic? Built twice on JDK 21,
  # the second time from a clean tree on one worker with no build cache and the version passed as
  # Gradle properties (as F-Droid's recipe does); the two unsigned APKs must be identical. A final
  # release runs the signed form of this check against F-Droid's exact procedure (release job).
  reproducible:
    name: Reproducible fdroid APK
    if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Build twice and compare
        env:
          TUTTI_VERSION_NAME: 0.0.0-repro
          TUTTI_VERSION_CODE: "1"
        run: |
          out=app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
          mkdir -p repro
          ./gradlew --stacktrace :app:assembleFdroidRelease
          cp "$out" repro/first.apk
          ./gradlew --stacktrace clean
          env -u TUTTI_VERSION_NAME -u TUTTI_VERSION_CODE ./gradlew --stacktrace --no-build-cache --rerun-tasks --max-workers=1 \
            -Ptutti.versionName=0.0.0-repro -Ptutti.versionCode=1 :app:assembleFdroidRelease
          cp "$out" repro/second.apk
          sha256sum repro/*.apk
          if ! cmp -s repro/first.apk repro/second.apk; then
            echo "::error::The fdroid release APK is not reproducible; entries that differ (CRC-32, name):"
            diff <(unzip -lv repro/first.apk | awk '{print $7, $8}') <(unzip -lv repro/second.apk | awk '{print $7, $8}') || true
            exit 1
          fi

      - name: Upload the two builds
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reproducible
          path: repro/
          if-no-files-found: ignore

  release:
    name: Release APK
    # A pushed v* tag, or a manual run on main naming the tag to create: a tag made
    # with the workflow token would not start another run, so this one releases it.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive version from the tag
        run: |
          if ! [[ "$TAG" == v* ]]; then
            echo "::error::Tag $TAG must start with v"
            exit 1
          fi
          version="${TAG#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-dev\.([0-9]+))?$ ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-dev.N"
            exit 1
          fi
          # A dev build sorts below its final release: 0.1.0-dev.3 < 0.1.0.
          dev="${BASH_REMATCH[5]:-99}"
          if [ "$dev" -gt 98 ] && [ -n "${BASH_REMATCH[4]}" ]; then
            echo "::error::dev numbers stop at 98"
            exit 1
          fi
          code=$(( (BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3]) * 100 + dev ))
          echo "TUTTI_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "TUTTI_VERSION_CODE=$code" >> "$GITHUB_ENV"
          if [ -n "${BASH_REMATCH[4]}" ]; then echo "PRERELEASE=true" >> "$GITHUB_ENV"; else echo "PRERELEASE=false" >> "$GITHUB_ENV"; fi

      # A final release needs all four secrets: never an unsigned APK, and never one signed
      # with the public debug key, which anyone could use to ship an "update". A -dev tag
      # without them still ships the debug build as a pre-release, for testing on Erwann's
      # phones until the release key exists (Erwann, 2026-10-25).
      - name: Choose signing
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "SIGNED=true" >> "$GITHUB_ENV"
          elif [ "$PRERELEASE" = "true" ]; then
            echo "::warning::Missing repository secrets: ${missing[*]}. Publishing the debug APK as a dev pre-release."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          else
            echo "::error::Missing repository secrets: ${missing[*]}. A final release needs the release key."
            exit 1
          fi

      - name: Restore the keystore
        if: env.SIGNED == 'true'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "TUTTI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # JDK 21: the default on F-Droid's Debian Trixie build server, which the recipe installs too.
      # The fdroid APK below must match F-Droid's own build byte for byte, and javac's output can
      # differ between JDK majors (docs/fdroid.md, "Reproducibility").
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.4.1

      # A final release builds the fdroid flavour too, with the same key: F-Droid rebuilds it from
      # source and publishes this signed copy only if the two match (`Binaries` in the recipe).
      - name: Assemble release
        if: env.SIGNED == 'true'
        run: |
          tasks=(:app:assembleGithubRelease)
          if [ "$PRERELEASE" = "false" ]; then tasks+=(:app:assembleFdroidRelease); fi
          ./gradlew --stacktrace "${tasks[@]}"

      - name: Verify the signature
        if: env.SIGNED == 'true'
        run: |
          apk=app/build/outputs/apk/github/release/app-github-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk not found (an unsigned build would be app-github-release-unsigned.apk)"
            ls -la app/build/outputs/apk/github/release/ || true
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"
          name=$(grep '^app.name=' gradle.properties | cut -d= -f2)
          cp "$apk" "$RUNNER_TEMP/$name-$TUTTI_VERSION_NAME.apk"
          echo "RELEASE_APK=$RUNNER_TEMP/$name-$TUTTI_VERSION_NAME.apk" >> "$GITHUB_ENV"

      # R8's mapping, to read the release's stack traces; it names no secret, only our classes.
      - name: Keep the R8 mapping
        if: env.SIGNED == 'true'
        run: |
          mapping=app/build/outputs/mapping/githubRelease/mapping.txt
          [ -f "$mapping" ] || { echo "::error::$mapping not found"; exit 1; }
          name=$(grep '^app.name=' gradle.properties | cut -d= -f2)
          cp "$mapping" "$RUNNER_TEMP/$name-$TUTTI_VERSION_NAME-mapping.txt"
          echo "RELEASE_MAPPING=$RUNNER_TEMP/$name-$TUTTI_VERSION_NAME-mapping.txt" >> "$GITHUB_ENV"

      # What F-Droid will check, run here first: rebuild the fdroid flavour from a clean tree with no
      # build cache, unsigned, the version passed as Gradle properties exactly as the recipe passes
      # them, then copy the release signature onto that rebuild and require it to verify
      # (apksigcopier, the tool fdroidserver uses). A mismatch stops the release before it ships an
      # APK F-Droid would refuse.
      - name: Check the fdroid APK reproduces
        if: env.SIGNED == 'true' && env.PRERELEASE == 'false'
        run: |
          signed=app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          [ -f "$signed" ] || { echo "::error::$signed not found"; ls -la app/build/outputs/apk/fdroid/release/ || true; exit 1; }
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$signed"
          name=$(grep '^app.name=' gradle.properties | cut -d= -f2)
          fdroid_apk="$RUNNER_TEMP/$name-$TUTTI_VERSION_NAME-fdroid.apk"
          cp "$signed" "$fdroid_apk"
          ./gradlew --stacktrace clean
          env -u TUTTI_KEYSTORE_PATH -u TUTTI_VERSION_NAME -u TUTTI_VERSION_CODE ./gradlew --stacktrace --no-build-cache --rerun-tasks \
            "-Ptutti.versionName=$TUTTI_VERSION_NAME" "-Ptutti.versionCode=$TUTTI_VERSION_CODE" :app:assembleFdroidRelease
          unsigned=app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
          [ -f "$unsigned" ] || { echo "::error::$unsigned not found"; ls -la app/build/outputs/apk/fdroid/release/ || true; exit 1; }
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet apksigcopier==1.1.1
          PATH="$(dirname "$apksigner"):$PATH" "$RUNNER_TEMP/venv/bin/apksigcopier" compare --unsigned "$fdroid_apk" "$unsigned"
          echo "RELEASE_FDROID_APK=$fdroid_apk" >> "$GITHUB_ENV"

      - name: Assemble debug
        if: env.SIGNED != 'true'
        run: |
          # Non-debuggable (app/build.gradle.kts): same id and signature, but compiled by ART.
          ./gradlew --stacktrace -Ptutti.devRelease :app:assembleGithubDebug
          apk=app/build/outputs/apk/github/debug/app-github-debug.apk
          [ -f "$apk" ] || { echo "::error::$apk not found"; ls -la app/build/outputs/apk/github/debug/ || true; exit 1; }
          name=$(grep '^app.name=' gradle.properties | cut -d= -f2)
          cp "$apk" "$RUNNER_TEMP/$name-$TUTTI_VERSION_NAME-debug.apk"
          echo "RELEASE_APK=$RUNNER_TEMP/$name-$TUTTI_VERSION_NAME-debug.apk" >> "$GITHUB_ENV"

      # Asset names are the updater's contract (protocol/update/Updates.kt, `assetFor`): a release
      # install takes `tutti-<version>.apk`, a debug install `tutti-<version>-debug.apk`. Renaming
      # either strands every install. `tutti-<version>-fdroid.apk` (final releases only) is for
      # F-Droid's `Binaries` URL; every release-key install skips `*-fdroid.apk`, since v0.2.0.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # A pushed tag must already exist; a manual run creates it on the commit it built.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists"
              exit 1
            fi
            flags+=(--target "$GITHUB_SHA")
          else
            flags+=(--verify-tag)
          fi
          files=("$RELEASE_APK")
          if [ -n "${RELEASE_MAPPING:-}" ]; then files+=("$RELEASE_MAPPING"); fi
          if [ -n "${RELEASE_FDROID_APK:-}" ]; then files+=("$RELEASE_FDROID_APK"); fi
          gh release create "$TAG" "${files[@]}" --generate-notes --title "$TAG" "${flags[@]}"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
