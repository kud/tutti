# The product name lives here, and only here.
# rootProject.name, the launcher label and the applicationId all read these.
# Kotlin packages (io.kud.tutti.*) are a code namespace and do not need to follow a rename.
app.name=tutti
app.label=tutti
app.applicationId=app.beansontoast.tutti

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
