# The product name is provisional and lives here, and only here.
# rootProject.name, the launcher label and the applicationId all read these.
# Kotlin packages (io.kud.salon.*) are a code namespace and do not need to follow a rename.
app.name=salon
app.label=Salon
app.applicationId=io.kud.salon

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
